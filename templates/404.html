<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - ToxiDerma-XAI</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e1a;
            color: #f5f7fa;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .error-container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: #fa2a55;
            font-size: 3rem;
            margin-bottom: 20px;
        }
        p {
            color: #b8c5d1;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 30px;
            background: linear-gradient(135deg, #20e3b2, #fa2a55);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: transform 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <p>Page Not Found</p>
        <p>The requested page could not be found.</p>
        <a href="/" class="btn">
            <i class="fas fa-home"></i>
            Return to Home
        </a>
    </div>
</body>
</html>
